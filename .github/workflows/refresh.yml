name: refresh-data
on:
  schedule: [{cron: "0 9 * * 2"}]  # Tuesdays: the prior Mon-Sun week is complete
  workflow_dispatch:
permissions: {contents: write}
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.lock
      - name: Rebuild every table and the web data
        run: |
          python -m nynoise.data
          python -m nynoise.model
          python -m nynoise.factors
          python -m nynoise.spatial
          python -m nynoise.export
          python -m nynoise.readme
        env: {SOCRATA_APP_TOKEN: "${{ secrets.SOCRATA_APP_TOKEN }}"}
      - run: pytest -q
      - run: |
          git config user.name "refresh-bot" && git config user.email "bot@users.noreply.github.com"
          git add data web/public/data Readme.md && (git diff --cached --quiet || git commit -m "data: weekly refresh" && git push)
