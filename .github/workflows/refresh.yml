name: refresh-data
on:
  schedule: [{cron: "0 9 * * 2"}]  # Tuesdays: the prior Mon-Sun week is complete
  workflow_dispatch:
permissions: {contents: write}
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements-dev.txt
      - run: python -m nynoise.data && python -m nynoise.model
        env: {SOCRATA_APP_TOKEN: "${{ secrets.SOCRATA_APP_TOKEN }}"}
      - run: pytest -q
      - run: |
          git config user.name "refresh-bot" && git config user.email "bot@users.noreply.github.com"
          git add data && (git diff --cached --quiet || git commit -m "data: weekly refresh" && git push)
